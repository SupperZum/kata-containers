[package]
name = "kata-agent"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oci-spec.workspace = true
lazy_static.workspace = true
ttrpc.workspace = true
protobuf.workspace = true
libc.workspace = true
nix.workspace = true
capctl.workspace = true
serde_json.workspace = true
scan_fmt.workspace = true
scopeguard.workspace = true
thiserror.workspace = true
regex.workspace = true
serial_test.workspace = true
url.workspace = true
derivative.workspace = true
const_format.workspace = true

# Async helpers
async-trait.workspace = true
async-recursion.workspace = true
futures.workspace = true

# Async runtime
tokio.workspace = true
tokio-vsock.workspace = true

netlink-sys.workspace = true
rtnetlink.workspace = true
netlink-packet-route.workspace = true
netlink-packet-core.workspace = true
ipnetwork.workspace = true

slog.workspace = true
slog-scope.workspace = true
slog-term.workspace = true

# Redirect ttrpc log calls
slog-stdlog.workspace = true
log.workspace = true

cfg-if.workspace = true
prometheus.workspace = true
procfs.workspace = true

anyhow.workspace = true

cgroups.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber.workspace = true
# TODO: bump tracing-opentelemetry to sync with version in workspace
tracing-opentelemetry = "0.17.0"
opentelemetry.workspace = true

# Configuration
serde.workspace = true
toml.workspace = true
clap.workspace = true
strum.workspace = true
strum_macros.workspace = true

# Local dependencies
kata-agent-policy = { workspace = true, optional = true }
mem-agent.workspace = true
rustjail.workspace = true
protocols = { workspace = true, features = ["async", "with-serde"] }
kata-sys-util.workspace = true
kata-types.workspace = true
runtime-spec.workspace = true
safe-path.workspace = true
# Note: this crate sets the slog 'max_*' features which allows the log level
# to be modified at runtime.
logging.workspace = true
vsock-exporter.workspace = true
pathrs.workspace = true
execution-proof-handoff = { path = "../../../execution-proof-prototype/handoff", optional = true }
execution-proof-contract = { path = "../../../execution-proof-prototype/contract", optional = true }
attester = { path = "../../../guest-components-prepared-dev/attestation-agent/attester", default-features = false, features = ["execution-quote-tdx"], optional = true }
image-rs = { package = "image-rs-preparation", path = "../../../guest-components-prepared-dev/image-rs/preparation-core", default-features = false, features = ["launch-preparation-receive"], optional = true }

# Initdata
base64 = { workspace = true }
sha2 = { workspace = true }
async-compression = { version = "0.4.22", features = ["tokio", "gzip"] }

container-device-interface.workspace = true

[target.'cfg(target_arch = "s390x")'.dependencies]
pv_core = { git = "https://github.com/ibm-s390-linux/s390-tools", rev = "4942504a9a2977d49989a5e5b7c1c8e07dc0fa41", package = "s390_pv_core" }

[dev-dependencies]
tempfile.workspace = true
which.workspace = true
rstest.workspace = true

test-utils.workspace = true

[profile.release]
lto = true

[features]
launch-admission = ["dep:execution-proof-handoff"]
rootfs-custody = ["launch-admission", "execution-proof-handoff/rootfs-custody", "dep:image-rs"]
exec-observer = ["rustjail/exec-observer"]
final-task = ["rootfs-custody", "exec-observer", "rustjail/final-task", "image-rs/launch-preparation-execution"]
final-task-native = ["final-task", "dep:execution-proof-contract"]
protected-export = ["final-task"]
protected-export-tdx = ["protected-export", "dep:attester"]
protected-export-gcp-native = ["final-task-native", "protected-export-gcp-tdx"]
protected-export-gcp-tdx = ["protected-export", "dep:execution-proof-contract", "dep:attester"]
gcp-proof-startup = ["protected-export-gcp-tdx", "execution-proof-handoff/gcp-startup"]
protected-export-native = ["final-task-native", "protected-export-tdx"]
seccomp = ["rustjail/seccomp"]
agent-policy = ["kata-agent-policy"]
init-data = []
devicemapper = ["kata-types/devicemapper"]

[[bin]]
name = "kata-final-task-native"
path = "src/bin/final_task_native.rs"
test = false
required-features = ["final-task-native"]

[[bin]]
name = "kata-protected-export-native"
path = "src/bin/final_task_native.rs"
test = false
required-features = ["protected-export-native"]

[[bin]]
name = "kata-protected-export-gcp-native"
path = "src/bin/final_task_native.rs"
test = false
required-features = ["protected-export-gcp-native"]

[[bin]]
name = "kata-agent-gcp-proof"
path = "src/bin/gcp_proof.rs"
required-features = ["gcp-proof-startup"]
